<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Participants UDD</title><style>
:root{--blue:#006eaa;--ink:#1b344b;--muted:#667d90;--line:#e5edf3;--pink:#f4b2bc}
*{box-sizing:border-box}html,body{margin:0;background:#f7f9fc;color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.shell{padding:8px 8px 28px;max-width:800px;margin:auto}
.search{display:flex;align-items:center;gap:9px;border:1px solid #dce8f0;border-radius:13px;background:#fff;padding:12px 14px}
.search svg{flex-shrink:0}.search input{border:0;outline:0;flex:1;min-width:0;background:none;font-size:14px;color:var(--ink)}
.filters{display:flex;gap:8px;margin:11px 0 16px}.filters select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 8px;color:#425a70;font-size:12px}
.summary{font-size:12px;color:var(--muted);font-weight:650;margin:0 2px 12px}
.list{display:flex;flex-direction:column;gap:9px}
.person{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 11px;box-shadow:0 2px 8px #23496a08}
.avatar{width:58px;height:58px;flex:0 0 58px;border-radius:12px;object-fit:cover;object-position:center center;background:#f0f3f5}
.initials{display:grid;place-items:center;color:var(--blue);font-weight:800;font-size:18px}
.content{flex:1;min-width:0}.name{font-size:14px;font-weight:800;line-height:1.25;margin:0 0 3px;overflow-wrap:anywhere}
.job{font-size:12px;color:#4e6579;margin:0 0 3px;line-height:1.35}
.org{font-size:11px;color:var(--blue);font-weight:750;line-height:1.3;overflow-wrap:anywhere}
.controls{display:flex;flex-direction:column;gap:8px;align-items:center}
.details{border:0;background:#eaf5fb;color:var(--blue);border-radius:9px;padding:9px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.fav{border:0;background:#fff1f4;color:#bd5a77;border-radius:9px;width:34px;height:30px;font-size:20px;line-height:1}
.fav.active{background:#f4b2bc;color:#8e2345}
.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#122c46a6;z-index:20}
.overlay.open{display:flex}.sheet{width:100%;max-width:370px;max-height:calc(100dvh - 36px);overflow:auto;background:#fff;border-radius:18px;padding:12px 18px 22px;box-shadow:0 16px 48px #122c4630}
.close{display:block;margin-left:auto;background:#f0f4f7;border:0;border-radius:10px;padding:7px 12px;font-size:22px}
.sheet .avatar{display:block;width:70px;height:70px;border-radius:14px;margin:2px auto 9px}
.sheet h2{text-align:center;margin:0 0 7px;font-size:17px}.sheet p{text-align:center;margin:5px 0;color:#566b7d}
.mail{display:block;margin-top:13px;background:#eaf6fc;color:var(--blue);border-radius:12px;padding:14px;text-align:center;overflow-wrap:anywhere;font-weight:750}
.mail.none{background:#f4f6f8;color:#708091}
@media(max-width:365px){.person{gap:8px;padding:10px 7px}.avatar{width:49px;height:49px;flex-basis:49px}.details{padding:8px 7px;font-size:11px}.name{font-size:12px}.job{font-size:11px}}
</style></head><body><main class="shell">
<div class="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#006eaa" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="q" type="search" placeholder="Rechercher un nom, un village…"></div>
<div class="filters"><select id="org"><option value="">Tous les établissements</option></select><select id="job"><option value="">Toutes les fonctions</option></select></div>
<p class="summary" id="summary">Chargement des participants…</p><div class="list" id="list"></div><p class="empty" id="empty" hidden>Aucun participant ne correspond à votre recherche.</p>

const KEY='udd2026_favorites_v1';
const $=id=>document.getElementById(id);
const norm=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function getFav(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function saveFav(name){const f=getFav();const n=f.includes(name)?f.filter(x=>x!==name):[...f,name];try{localStorage.setItem(KEY,JSON.stringify(n))}catch(e){};try{parent.postMessage({type:'udd-favorites-changed'},location.origin)}catch(e){}render()}
function makeAvatar(p){if(p.photo){const im=document.createElement('img');im.className='avatar';im.src=p.photo;im.alt='';im.loading='lazy';im.onerror=()=>im.replaceWith(makeInitials(p));return im}return makeInitials(p)}
function makeInitials(p){const d=document.createElement('div');d.className='avatar initials';d.textContent=p.name.split(' ').slice(0,2).map(x=>x[0]).join('');return d}
function openCard(p){const s=$('sheet');s.replaceChildren();const b=document.createElement('button');b.className='close';b.textContent='×';b.setAttribute('aria-label','Fermer');b.onclick=closeCard;s.append(b,makeAvatar(p));const h=document.createElement('h2');h.textContent=p.name;s.append(h);for(const val of [p.function,p.establishment]){if(val){const q=document.createElement('p');q.textContent=val;s.append(q)}}const a=document.createElement(p.email?'a':'div');a.className='mail'+(p.email?'':' none');a.textContent=p.email?'✉ '+p.email:'Adresse e-mail non renseignée';if(p.email)a.href='mailto:'+p.email;s.append(a);$('overlay').classList.add('open')}
function closeCard(){$('overlay').classList.remove('open')}
function render(){const q=norm($('q').value),o=$('org').value,j=$('job').value;const data=P.filter(p=>(!o||p.establishment===o)&&(!j||p.function===j)&&(!q||norm([p.name,p.establishment,p.function].join(' ')).includes(q)));$('summary').textContent=data.length+' participant'+(data.length===1?'':'s');$('list').replaceChildren();$('empty').hidden=data.length>0;const fav=getFav();for(const p of data){const card=document.createElement('article');card.className='person';card.append(makeAvatar(p));const content=document.createElement('div');content.className='content';for(const [tag,cls,val] of [['h3','name',p.name],['p','job',p.function],['div','org',p.establishment]]){const el=document.createElement(tag);el.className=cls;el.textContent=val||'';content.append(el)}card.append(content);const controls=document.createElement('div');controls.className='controls';const detail=document.createElement('button');detail.className='details';detail.textContent='Voir la fiche';detail.onclick=()=>openCard(p);const heart=document.createElement('button');heart.className='fav'+(fav.includes(p.name)?' active':'');heart.textContent=fav.includes(p.name)?'♥':'♡';heart.setAttribute('aria-label','Ajouter aux favoris');heart.onclick=()=>saveFav(p.name);controls.append(detail,heart);card.append(controls);$('list').append(card)}}
for(const [id,field] of [['org','establishment'],['job','function']]){for(const val of [...new Set(P.map(p=>p[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'))){const option=document.createElement('option');option.value=val;option.textContent=val;$(id).append(option)}$(id).addEventListener('change',render)}
$('q').addEventListener('input',render);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeCard()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});render();
</script></body></html>
