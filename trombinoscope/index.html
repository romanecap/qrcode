const old=fav();localStorage.setItem(KEY,JSON.stringify(old.includes(name)?old.filter(x=>x!==name):[...old,name]));parent.postMessage({type:'udd-favorites-changed'},location.origin);render()}function avatar(p){if(p.photo){let img=document.createElement('img');img.className='avatar';img.src=p.photo;img.alt='';img.onerror=()=>img.replaceWith(initials(p));return img}return initials(p)}function initials(p){let d=document.createElement('div');d.className='avatar initials';d.textContent=p.name.split(' ').slice(0,2).map(x=>x[0]).join('');return d}function profile(p){let sheet=$('sheet');sheet.replaceChildren();let close=document.createElement('button');close.className='close';close.textContent='✕';close.onclick=()=>{$('modal').classList.remove('open')};sheet.append(close,avatar(p));let h=document.createElement('h2');h.textContent=p.name;sheet.append(h);for(let text of [p.function,p.establishment]){if(!text)continue;let line=document.createElement('p');line.textContent=text;sheet.append(line)}let m=document.createElement(p.email?'a':'div');m.className='mail'+(p.email?'':' missing');m.textContent=p.email?'✉ '+p.email:'Adresse e-mail non renseignée';if(p.email)m.href='mailto:'+p.email;sheet.append(m);$('modal').classList.add('open')}function render(){let q=norm($('q').value),org=$('org').value,job=$('job').value,items=P.filter(p=>(!org||p.establishment===org)&&(!job||p.function===job)&&(!q||norm([p.name,p.establishment,p.function].join(' ')).includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'fr'));$('count').textContent=items.length+' participants';$('grid').replaceChildren();let favorites=fav();for(let p of items){let c=document.createElement('article');c.className='person';c.append(avatar(p));let h=document.createElement('h3');h.textContent=p.name;c.append(h);let j=document.createElement('div');j.className='job';j.textContent=p.function||' ';c.append(j);let o=document.createElement('div');o.className='org';o.textContent=p.establishment||' ';c.append(o);let actions=document.createElement('div');actions.className='actions';let v=document.createElement('button');v.className='view';v.textContent='Voir la fiche';v.onclick=()=>profile(p);let f=document.createElement('button');f.className='heart'+(favorites.includes(p.name)?' active':'');f.textContent=favorites.includes(p.name)?'♥':'♡';f.onclick=()=>toggle(p.name);actions.append(v,f);c.append(actions);$('grid').append(c)}}for(let [id,field] of [['org','establishment'],['job','function']]){for(let value of [...new Set(P.map(x=>x[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'))){let o=document.createElement('option');o.value=value;o.textContent=value;$(id).append(o)}$(id).onchange=render}$('q').oninput=render;$('clear').onclick=()=>{$('q').value='';render()};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};let contact=new URLSearchParams(location.search).get('contact');if(contact){let p=P.find(x=>norm(x.name)===norm(contact));if(p)profile(p)}render();</script></body></html>
